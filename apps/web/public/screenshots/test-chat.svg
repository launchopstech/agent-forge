<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MindRithm test chat review</title>
  <desc id="desc">Test chat panel with a governance-oriented conversation and review notes.</desc>
  <rect width="1440" height="900" fill="#F8FAFC"/>
  <rect x="116" y="70" width="1208" height="760" rx="24" fill="white" stroke="#D1D5DB"/>
  <rect x="116" y="70" width="1208" height="86" rx="24" fill="#0F172A"/>
  <circle cx="166" cy="113" r="22" fill="#4F46E5"/>
  <text x="206" y="120" fill="#E2E8F0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Test Chat</text>
  <text x="1086" y="120" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="14">EU Returns Advisor</text>
  <rect x="166" y="206" width="514" height="84" rx="18" fill="#F3F4F6"/>
  <text x="198" y="242" fill="#1E293B" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">User</text>
  <text x="198" y="268" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">Can I return an opened item after 45 days?</text>
  <rect x="760" y="326" width="514" height="132" rx="18" fill="#E0E7FF"/>
  <text x="792" y="362" fill="#3730A3" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">EU Returns Advisor</text>
  <text x="792" y="392" fill="#1E293B" font-family="Inter, Arial, sans-serif" font-size="16">I can help check eligibility. Opened items are</text>
  <text x="792" y="420" fill="#1E293B" font-family="Inter, Arial, sans-serif" font-size="16">usually reviewed if they are outside the standard</text>
  <text x="792" y="448" fill="#1E293B" font-family="Inter, Arial, sans-serif" font-size="16">30-day policy, so I will gather context first.</text>
  <rect x="166" y="500" width="546" height="84" rx="18" fill="#F3F4F6"/>
  <text x="198" y="536" fill="#1E293B" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">User</text>
  <text x="198" y="562" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">It was a defective recommendation from the quiz.</text>
  <rect x="760" y="620" width="514" height="104" rx="18" fill="#ECFDF5"/>
  <text x="792" y="656" fill="#065F46" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Review result</text>
  <text x="792" y="686" fill="#1E293B" font-family="Inter, Arial, sans-serif" font-size="16">Correctly avoids a refund promise and escalates</text>
  <text x="792" y="714" fill="#1E293B" font-family="Inter, Arial, sans-serif" font-size="16">high-risk recommendation bias language.</text>
  <rect x="166" y="748" width="1108" height="48" rx="14" fill="#F8FAFC" stroke="#D1D5DB"/>
  <text x="194" y="779" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="15">Ask another policy edge case...</text>
  <rect x="1010" y="748" width="104" height="48" rx="14" fill="#4F46E5"/>
  <text x="1044" y="779" fill="white" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Send</text>
  <rect x="1130" y="748" width="144" height="48" rx="14" fill="#FEF3C7"/>
  <text x="1160" y="779" fill="#92400E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Save note</text>
</svg>
