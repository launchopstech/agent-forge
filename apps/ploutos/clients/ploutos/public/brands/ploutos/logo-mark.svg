<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- P fill gradient: violet-light → violet → indigo (top-left to bottom-right) -->
    <linearGradient id="pGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="48%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Node fill gradient: bright centre → violet -->
    <radialGradient id="nodeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>

    <!-- Subtle background inner glow -->
    <radialGradient id="bgGlow" cx="55%" cy="38%" r="55%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter for the P mark -->
    <filter id="markGlow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter for the node dot -->
    <filter id="nodeGlow" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Background tile ── -->
  <rect width="64" height="64" rx="14" fill="#06060f"/>
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>
  <!-- Outer border -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none"
        stroke="rgba(124,58,237,0.28)" stroke-width="1"/>
  <!-- Top-edge highlight for glass depth -->
  <path d="M14 1 Q32 0 50 1" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- ── P letterform (even-odd so counter punches through) ── -->
  <!--
    Outer P boundary (clockwise):
      Stem left:   x=9,  y=10 → y=54
      Stem width:  11px
      Bowl outer:  from (20,10) cubic-bezier to (20,35), arcing to x≈41
    Inner counter (anticlockwise punch):
      From (20,17) cubic-bezier back to (20,28), arcing to x≈34
  -->
  <path
    fill-rule="evenodd"
    fill="url(#pGrad)"
    filter="url(#markGlow)"
    d="
      M 9 10
      L 20 10
      C 48 10, 48 35, 20 35
      L 20 54
      L 9  54
      Z

      M 20 17
      C 38 17, 38 28, 20 28
      Z
    "
  />

  <!-- ── Node: glowing dot at the outer-bowl terminal ── -->
  <!-- Rightmost extent of outer bowl bezier is approx (41, 22) -->
  <circle cx="41" cy="22" r="3.2" fill="url(#nodeGrad)" filter="url(#nodeGlow)"/>
</svg>
