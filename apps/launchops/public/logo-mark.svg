<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- L fill gradient: violet-light → violet → indigo -->
    <linearGradient id="lGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="48%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Node fill gradient -->
    <radialGradient id="lNode" cx="30%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>

    <!-- Background inner glow -->
    <radialGradient id="lBg" cx="65%" cy="28%" r="55%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow on the L mark -->
    <filter id="lMarkGlow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow on the node -->
    <filter id="lNodeGlow" x="-140%" y="-140%" width="380%" height="380%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow on the trajectory arc -->
    <filter id="lArcGlow" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Background tile ── -->
  <rect width="64" height="64" rx="14" fill="#06060f"/>
  <rect width="64" height="64" rx="14" fill="url(#lBg)"/>
  <!-- Border -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none"
        stroke="rgba(124,58,237,0.28)" stroke-width="1"/>
  <!-- Top highlight -->
  <path d="M14 1 Q32 0 50 1" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- ── L letterform ── -->
  <!--
    Vertical stem:  x=12–22, y=10–54  (10px wide, 44px tall)
    Horizontal foot: x=12–48, y=44–54  (36px wide, 10px tall)
    Inner corner at (22, 44)
  -->
  <path
    fill="url(#lGrad)"
    filter="url(#lMarkGlow)"
    d="M 12 10 L 22 10 L 22 44 L 48 44 L 48 54 L 12 54 Z"
  />

  <!-- ── Launch trajectory arc ── -->
  <!--
    Subtle dashed arc from top of stem (22, 12)
    curving upward-right to the node at (42, 15)
    Quadratic bezier control point at (34, 3)
  -->
  <path
    d="M 22 12 Q 34 2 42 15"
    fill="none"
    stroke="rgba(196,181,253,0.45)"
    stroke-width="1.2"
    stroke-dasharray="2.5 2.2"
    stroke-linecap="round"
    filter="url(#lArcGlow)"
  />

  <!-- ── Node at arc endpoint ── -->
  <circle cx="42" cy="15" r="3.2" fill="url(#lNode)" filter="url(#lNodeGlow)"/>
</svg>
