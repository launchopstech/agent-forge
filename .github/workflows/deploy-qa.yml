name: Deploy — QA

# Deployment pipeline for the qa branch:
# 1. Run CI checks (lint, typecheck, test, build, chromatic)
# 2. Deploy all configured Vercel projects to their QA environment
# 3. Run E2E tests against the deployed QA environment
#
# Requires a GitHub Environment named "qa" with:
#   Secret: VERCEL_DEPLOY_HOOK              (agent-forge-web)
#   Secret: VERCEL_DEPLOY_HOOK_BLUE_STONE   (ploutos-blue-stone)
#   Secret: VERCEL_DEPLOY_HOOK_LAUNCHOPS    (launchops — add once vercel-linked)
#   Var:    NEXT_PUBLIC_APP_URL             (e.g. https://qa.yourapp.com)

on:
  push:
    branches: [qa]

jobs:
  # ============================================================
  # Phase 1: CI Checks
  # ============================================================
  checks:
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: qa
      run-e2e: false
      run-chromatic: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  # ============================================================
  # Phase 2: Deploy all Vercel projects to QA
  # ============================================================
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: [checks]
    environment: qa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Deploy all projects
        uses: ./.github/actions/multi-deploy
        with:
          hook_forge_web: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          hook_launchops: ${{ secrets.VERCEL_DEPLOY_HOOK_LAUNCHOPS }}
          hook_blue_stone: ${{ secrets.VERCEL_DEPLOY_HOOK_BLUE_STONE }}

  # ============================================================
  # Phase 3: Post-deploy E2E on QA
  # ============================================================
  e2e-qa:
    needs: [deploy-qa]
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: qa
      run-e2e: true
      run-chromatic: false
      wait-for-deployment: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
