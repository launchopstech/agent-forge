name: Deploy — QA

# Deployment pipeline for the qa branch:
# 1. Run CI checks (lint, typecheck, test, build, chromatic)
# 2. Deploy to Vercel QA environment
# 3. Run E2E tests against the deployed QA environment
#
# Requires a GitHub Environment named "qa" with:
#   Secret: VERCEL_DEPLOY_HOOK  (Vercel deploy hook URL for the QA environment)
#   Var:    NEXT_PUBLIC_APP_URL (e.g. https://qa.yourapp.com)

on:
  push:
    branches: [qa]

jobs:
  # ============================================================
  # Phase 1: CI Checks
  # ============================================================
  checks:
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: qa
      run-e2e: false
      run-chromatic: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  # ============================================================
  # Phase 2: Deploy to QA
  # ============================================================
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: [checks]
    environment: qa
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Trigger Vercel QA deployment
        id: deploy
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret not set for qa environment, skipping deployment"
            echo "url=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          curl -f -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "url=${{ vars.NEXT_PUBLIC_APP_URL }}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          echo "### QA Deployment" >> $GITHUB_STEP_SUMMARY
          echo "URL: ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Phase 3: Post-deploy E2E on QA
  # ============================================================
  e2e-qa:
    needs: [deploy-qa]
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: qa
      run-e2e: true
      run-chromatic: false
      wait-for-deployment: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
