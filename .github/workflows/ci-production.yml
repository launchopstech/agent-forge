name: CI — Production

on:
  push:
    branches: [main]

jobs:
  checks:
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: production
      run-e2e: true
      run-chromatic: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  deploy:
    name: deploy to vercel
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - name: Trigger Vercel production deployment
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_PRODUCTION }}"
