name: Deploy — Staging

# Deployment pipeline for the staging branch:
# 1. Deploy all configured Vercel projects to their staging environment
# 2. Run E2E tests against the deployed staging environment
#
# Triggered by: push to staging branch (from qa → staging PR merge)
# Next step: open a PR from staging → prod to trigger deploy-production.yml
#
# Requires a GitHub Environment named "staging" with:
#   Secret: VERCEL_DEPLOY_HOOK              (agent-forge-web)
#   Secret: VERCEL_DEPLOY_HOOK_BLUE_STONE   (ploutos-blue-stone)
#   Secret: VERCEL_DEPLOY_HOOK_LAUNCHOPS    (launchops)
#   Var:    NEXT_PUBLIC_APP_URL             (e.g. https://staging.yourapp.com)

on:
  push:
    branches: [staging]

jobs:
  # ============================================================
  # Phase 1: Deploy all Vercel projects to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Deploy all projects
        uses: ./.github/actions/multi-deploy
        with:
          hook_forge_web: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          hook_launchops: ${{ secrets.VERCEL_DEPLOY_HOOK_LAUNCHOPS }}
          hook_blue_stone: ${{ secrets.VERCEL_DEPLOY_HOOK_BLUE_STONE }}

  # ============================================================
  # Phase 2: Post-deploy E2E on Staging
  # ============================================================
  e2e-staging:
    needs: [deploy-staging]
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: staging
      run-e2e: true
      run-chromatic: false
      wait-for-deployment: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
