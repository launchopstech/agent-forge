name: Deploy — Staging & Production

# Deployment pipeline (triggered by auto-promotion from main via ci-staging-prod.yml):
# 1. Deploy all configured Vercel projects to staging
# 2. Run E2E against staging (post-deploy via shared-checks)
# 3. Wait for manual approval
# 4. Deploy all configured Vercel projects to production
# 5. Run smoke tests against production (via shared-checks)
#
# CI checks are NOT re-run here — they already passed on main before promotion.
#
# Requires GitHub Environments:
#   "staging":    Secret VERCEL_DEPLOY_HOOK, VERCEL_DEPLOY_HOOK_BLUE_STONE,
#                 VERCEL_DEPLOY_HOOK_LAUNCHOPS, Var NEXT_PUBLIC_APP_URL
#   "production": Same secrets + required reviewers for approval gate

on:
  push:
    branches: [staging]

jobs:
  # ============================================================
  # Phase 1: Deploy all Vercel projects to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Deploy all projects
        uses: ./.github/actions/multi-deploy
        with:
          hook_forge_web: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          hook_launchops: ${{ secrets.VERCEL_DEPLOY_HOOK_LAUNCHOPS }}
          hook_blue_stone: ${{ secrets.VERCEL_DEPLOY_HOOK_BLUE_STONE }}

  # ============================================================
  # Phase 2: Post-deploy E2E on Staging
  # ============================================================
  e2e-staging:
    needs: [deploy-staging]
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: staging
      run-e2e: true
      run-chromatic: false
      wait-for-deployment: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  # ============================================================
  # Phase 3: Manual Approval Gate
  # ============================================================
  approval:
    name: Awaiting Production Approval
    runs-on: ubuntu-latest
    needs: [e2e-staging]
    environment: production # GitHub Environment with required reviewers
    steps:
      - name: Approval received
        run: echo "Production deployment approved"

  # ============================================================
  # Phase 4: Deploy all Vercel projects to Production
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [approval]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Deploy all projects
        uses: ./.github/actions/multi-deploy
        with:
          hook_forge_web: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          hook_launchops: ${{ secrets.VERCEL_DEPLOY_HOOK_LAUNCHOPS }}
          hook_blue_stone: ${{ secrets.VERCEL_DEPLOY_HOOK_BLUE_STONE }}

  # ============================================================
  # Phase 5: Post-deploy Smoke Tests on Production
  # ============================================================
  smoke-production:
    needs: [deploy-production]
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: production
      run-e2e: true
      run-chromatic: false
      e2e-test-path: e2e/smoke.spec.ts
      wait-for-deployment: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
