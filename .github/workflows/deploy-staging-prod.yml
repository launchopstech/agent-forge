name: Deploy — Staging & Production

# Deployment pipeline:
# 1. Run CI checks (lint, test, build) - e2e skipped, runs post-deploy
# 2. Deploy all configured Vercel projects to staging
# 3. Run E2E against staging (post-deploy via shared-checks)
# 4. Wait for manual approval
# 5. Deploy all configured Vercel projects to production
# 6. Run smoke tests against production (via shared-checks)
#
# Requires GitHub Environments:
#   "staging":    Secret VERCEL_DEPLOY_HOOK, VERCEL_DEPLOY_HOOK_BLUE_STONE,
#                 VERCEL_DEPLOY_HOOK_LAUNCHOPS, Var NEXT_PUBLIC_APP_URL
#   "production": Same secrets + required reviewers for approval gate

on:
  push:
    branches: [main]

jobs:
  # ============================================================
  # Phase 1: CI Checks (e2e runs post-deploy instead)
  # ============================================================
  checks:
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: staging
      run-e2e: false
      run-chromatic: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  # ============================================================
  # Phase 2: Deploy all Vercel projects to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [checks]
    uses: ./.github/workflows/shared-deploy.yml
    with:
      environment: staging
    secrets:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      VERCEL_DEPLOY_HOOK_LAUNCHOPS: ${{ secrets.VERCEL_DEPLOY_HOOK_LAUNCHOPS }}
      VERCEL_DEPLOY_HOOK_BLUE_STONE: ${{ secrets.VERCEL_DEPLOY_HOOK_BLUE_STONE }}

  # ============================================================
  # Phase 3: Post-deploy E2E on Staging
  # ============================================================
  e2e-staging:
    needs: [deploy-staging]
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: staging
      run-e2e: true
      run-chromatic: false
      wait-for-deployment: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  # ============================================================
  # Phase 4: Manual Approval Gate
  # ============================================================
  approval:
    name: Awaiting Production Approval
    runs-on: ubuntu-latest
    needs: [e2e-staging]
    environment: production # GitHub Environment with required reviewers
    steps:
      - name: Approval received
        run: echo "Production deployment approved"

  # ============================================================
  # Phase 5: Deploy all Vercel projects to Production
  # ============================================================
  deploy-production:
    name: Deploy to Production
    needs: [approval]
    uses: ./.github/workflows/shared-deploy.yml
    with:
      environment: production
    secrets:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      VERCEL_DEPLOY_HOOK_LAUNCHOPS: ${{ secrets.VERCEL_DEPLOY_HOOK_LAUNCHOPS }}
      VERCEL_DEPLOY_HOOK_BLUE_STONE: ${{ secrets.VERCEL_DEPLOY_HOOK_BLUE_STONE }}

  # ============================================================
  # Phase 6: Post-deploy Smoke Tests on Production
  # ============================================================
  smoke-production:
    needs: [deploy-production]
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: production
      run-e2e: true
      run-chromatic: false
      e2e-test-path: e2e/smoke.spec.ts
      wait-for-deployment: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
