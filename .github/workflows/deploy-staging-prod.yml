name: Deploy — Staging & Production

# Deployment pipeline (CI checks already passed on PR via ci-staging-prod.yml):
# 1. Deploy to staging
# 2. Run post-deploy E2E against staging
# 3. Wait for manual approval
# 4. Deploy to production
# 5. Run smoke tests against production

on:
  push:
    branches: [main]

jobs:
  # ============================================================
  # Phase 1: Deploy to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Trigger Vercel staging deployment
        id: deploy
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret not set, skipping deployment"
            echo "url=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "url=${{ vars.NEXT_PUBLIC_APP_URL }}" >> $GITHUB_OUTPUT

  # ============================================================
  # Phase 2: Post-deploy E2E on Staging
  # ============================================================
  e2e-staging:
    name: E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for staging deployment to be ready..."
          sleep 30  # Give Vercel time to deploy

      - name: Run E2E tests against staging
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_ENV: ${{ vars.NEXT_PUBLIC_APP_ENV }}

  # ============================================================
  # Phase 3: Manual Approval Gate
  # ============================================================
  approval:
    name: Awaiting Production Approval
    runs-on: ubuntu-latest
    needs: [e2e-staging]
    environment: production # GitHub Environment with required reviewers
    steps:
      - name: Approval received
        run: echo "Production deployment approved"

  # ============================================================
  # Phase 4: Deploy to Production
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [approval]
    environment: production
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Trigger Vercel production deployment
        id: deploy
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret not set, skipping deployment"
            echo "url=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "url=${{ vars.NEXT_PUBLIC_APP_URL }}" >> $GITHUB_OUTPUT

  # ============================================================
  # Phase 5: Post-deploy Smoke Tests on Production
  # ============================================================
  smoke-production:
    name: Smoke Tests (Production)
    runs-on: ubuntu-latest
    needs: [deploy-production]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for production deployment to be ready..."
          sleep 30  # Give Vercel time to deploy

      - name: Run smoke tests against production
        run: pnpm test:e2e e2e/smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_ENV: ${{ vars.NEXT_PUBLIC_APP_ENV }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production smoke tests failed! Consider rollback."
          # Add Slack/Discord notification here if needed
