name: Deploy — Staging & Production

# Unified deployment pipeline:
# 1. Run all checks (lint, test, build, e2e against localhost)
# 2. Deploy to staging
# 3. Run post-deploy E2E against staging
# 4. Wait for manual approval
# 5. Deploy to production
# 6. Run smoke tests against production

on:
  push:
    branches: [main]

jobs:
  # ============================================================
  # Phase 1: Pre-deployment checks (runs against localhost)
  # ============================================================
  checks:
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: staging
      run-e2e: true
      run-chromatic: true
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  # ============================================================
  # Phase 2: Deploy to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [checks]
    environment: staging
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Trigger Vercel staging deployment
        id: deploy
        run: |
          # Trigger deployment and capture URL if using Vercel CLI
          # For deploy hooks, the URL is predetermined
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}"
          echo "url=${{ vars.STAGING_URL }}" >> $GITHUB_OUTPUT

  # ============================================================
  # Phase 3: Post-deploy E2E on Staging
  # ============================================================
  e2e-staging:
    name: E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for staging deployment to be ready..."
          sleep 30  # Give Vercel time to deploy

      - name: Run E2E tests against staging
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.STAGING_URL }}
          NEXT_PUBLIC_APP_ENV: staging

  # ============================================================
  # Phase 4: Manual Approval Gate
  # ============================================================
  approval:
    name: Awaiting Production Approval
    runs-on: ubuntu-latest
    needs: [e2e-staging]
    environment: production # GitHub Environment with required reviewers
    steps:
      - name: Approval received
        run: echo "Production deployment approved"

  # ============================================================
  # Phase 5: Deploy to Production
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [approval]
    environment: production
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Trigger Vercel production deployment
        id: deploy
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_PRODUCTION }}"
          echo "url=${{ vars.NEXT_PUBLIC_APP_URL }}" >> $GITHUB_OUTPUT

  # ============================================================
  # Phase 6: Post-deploy Smoke Tests on Production
  # ============================================================
  smoke-production:
    name: Smoke Tests (Production)
    runs-on: ubuntu-latest
    needs: [deploy-production]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for production deployment to be ready..."
          sleep 30  # Give Vercel time to deploy

      - name: Run smoke tests against production
        run: pnpm test:e2e e2e/smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_ENV: production

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production smoke tests failed! Consider rollback."
          # Add Slack/Discord notification here if needed
