name: CI — Development

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  checks:
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: development
      run-e2e: false
      run-chromatic: false
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
