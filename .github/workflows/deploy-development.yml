name: Deploy — Development

# Deployment pipeline for the develop branch:
# 1. Run CI checks (lint, typecheck, test, build)
# 2. Deploy to Vercel development environment
#
# Requires a GitHub Environment named "development" with:
#   Secret: VERCEL_DEPLOY_HOOK  (Vercel deploy hook URL for the development environment)
#   Var:    NEXT_PUBLIC_APP_URL (e.g. https://dev.yourapp.com)

on:
  push:
    branches: [develop]

jobs:
  # ============================================================
  # Phase 1: CI Checks
  # ============================================================
  checks:
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: development
      run-e2e: false
      run-chromatic: false
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  # ============================================================
  # Phase 2: Deploy to Development
  # ============================================================
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [checks]
    environment: development
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Trigger Vercel development deployment
        id: deploy
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret not set for development environment, skipping deployment"
            echo "url=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          curl -f -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "url=${{ vars.NEXT_PUBLIC_APP_URL }}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          echo "### Development Deployment" >> $GITHUB_STEP_SUMMARY
          echo "URL: ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
