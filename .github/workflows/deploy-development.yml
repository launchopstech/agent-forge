name: Deploy — Development

# Deployment pipeline for the develop branch:
# 1. Run CI checks (lint, typecheck, test, build)
# 2. Deploy all configured Vercel projects to their development environment
#
# Requires a GitHub Environment named "development" with:
#   Secret: VERCEL_DEPLOY_HOOK              (agent-forge-web)
#   Secret: VERCEL_DEPLOY_HOOK_BLUE_STONE   (ploutos-blue-stone)
#   Secret: VERCEL_DEPLOY_HOOK_LAUNCHOPS    (launchops — add once vercel-linked)
#   Var:    NEXT_PUBLIC_APP_URL             (e.g. https://dev.yourapp.com)

on:
  push:
    branches: [develop]

jobs:
  # ============================================================
  # Phase 1: CI Checks
  # ============================================================
  checks:
    uses: ./.github/workflows/shared-checks.yml
    with:
      environment: development
      run-e2e: false
      run-chromatic: false
    secrets:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  # ============================================================
  # Phase 2: Deploy all Vercel projects to Development
  # ============================================================
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [checks]
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Deploy all projects
        uses: ./.github/actions/multi-deploy
        with:
          hook_forge_web: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          hook_launchops: ${{ secrets.VERCEL_DEPLOY_HOOK_LAUNCHOPS }}
          hook_blue_stone: ${{ secrets.VERCEL_DEPLOY_HOOK_BLUE_STONE }}
