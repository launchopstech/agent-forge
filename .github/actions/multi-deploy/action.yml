name: 'Multi-Project Vercel Deploy'
description: 'Fire Vercel deploy hooks for changed projects in parallel'

inputs:
  hook_forge_web:
    description: 'Deploy hook for @forge/web (agent-forge-web)'
    required: false
    default: ''
  hook_launchops:
    description: 'Deploy hook for @forge/launchops — requires vercel link first'
    required: false
    default: ''
  hook_blue_stone:
    description: 'Deploy hook for ploutos-blue-stone'
    required: false
    default: ''
  force_deploy:
    description: 'Deploy all configured projects regardless of changed files'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Detect changed projects
      shell: bash
      env:
        FORCE: ${{ inputs.force_deploy }}
      run: |
        if [ "$FORCE" = "true" ]; then
          echo "Force deploy — skipping change detection"
          echo "DEPLOY_WEB=true"        >> $GITHUB_ENV
          echo "DEPLOY_LAUNCHOPS=true"  >> $GITHUB_ENV
          echo "DEPLOY_BLUE_STONE=true" >> $GITHUB_ENV
          exit 0
        fi

        CHANGED=$(git diff HEAD^ HEAD --name-only 2>/dev/null || echo "__ALL__")

        if [ "$CHANGED" = "__ALL__" ]; then
          echo "Could not compute diff (first commit?) — deploying all"
          echo "DEPLOY_WEB=true"        >> $GITHUB_ENV
          echo "DEPLOY_LAUNCHOPS=true"  >> $GITHUB_ENV
          echo "DEPLOY_BLUE_STONE=true" >> $GITHUB_ENV
          exit 0
        fi

        echo "Changed files:"
        echo "$CHANGED"

        SHARED=$(echo "$CHANGED" | grep -c '^packages/' || true)

        WEB=false
        LAUNCHOPS=false
        BLUE_STONE=false

        { [ "$SHARED" -gt 0 ] || echo "$CHANGED" | grep -q '^apps/web/'; }       && WEB=true || true
        { [ "$SHARED" -gt 0 ] || echo "$CHANGED" | grep -q '^apps/launchops/'; } && LAUNCHOPS=true || true
        { [ "$SHARED" -gt 0 ] || echo "$CHANGED" | grep -q '^apps/ploutos/'; }   && BLUE_STONE=true || true

        echo "DEPLOY_WEB=$WEB"               >> $GITHUB_ENV
        echo "DEPLOY_LAUNCHOPS=$LAUNCHOPS"   >> $GITHUB_ENV
        echo "DEPLOY_BLUE_STONE=$BLUE_STONE" >> $GITHUB_ENV

    - name: Fire deploy hooks in parallel
      shell: bash
      env:
        HOOK_FORGE_WEB: ${{ inputs.hook_forge_web }}
        HOOK_LAUNCHOPS: ${{ inputs.hook_launchops }}
        HOOK_BLUE_STONE: ${{ inputs.hook_blue_stone }}
      run: |
        fire() {
          local name="$1" hook="$2" should_deploy="$3"
          if [ -z "$hook" ]; then
            echo "⏭  Skipping $name (no hook configured)"
            return 0
          fi
          if [ "$should_deploy" != "true" ]; then
            echo "⏭  Skipping $name (no relevant changes)"
            return 0
          fi
          echo "🚀 Deploying $name..."
          if curl -sf -X POST "$hook"; then
            echo "✅ $name hook accepted"
          else
            echo "❌ $name hook failed"
            return 1
          fi
        }

        PIDS=()
        fire "forge-web"          "$HOOK_FORGE_WEB"  "$DEPLOY_WEB"        & PIDS+=($!)
        fire "launchops"          "$HOOK_LAUNCHOPS"  "$DEPLOY_LAUNCHOPS"  & PIDS+=($!)
        fire "ploutos-blue-stone" "$HOOK_BLUE_STONE" "$DEPLOY_BLUE_STONE" & PIDS+=($!)

        EXIT=0
        for pid in "${PIDS[@]}"; do
          wait "$pid" || EXIT=1
        done
        exit $EXIT
